<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="/public/style/registro.css">
</head>
<body>
  <div class="container">
        <div class="form-card">
            <div class="header">
                <h2>Crea tu Cuenta</h2>
                <p>Únete a SaludConecta y gestiona tus medicamentos fácilmente.</p>
            </div>
            
            <form id="registroForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="tipoDocumento">Tipo de Documento</label>
                        <select id="tipoDocumento" required>
                            <option value="" disabled selected>Seleccione...</option>
                            <option value="CC">Cédula de Ciudadanía</option>
                            <option value="TI">Tarjeta de Identidad</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="numeroDocumento">Número de Documento</label>
                        <input type="text" id="numeroDocumento" placeholder="Ej: 10203040" required>
                    </div>

                    <div class="input-group full-width">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" placeholder="Tu nombre y apellidos" required>
                    </div>

                    <div class="input-group">
                        <label for="correo">Correo Electrónico</label>
                        <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="input-group">
                        <label>Número de Teléfono</label>
                        <input type="tel" placeholder="300 000 0000" required>
                    </div>

                    <div class="input-group">
                        <label>Fecha de Nacimiento</label>
                        <input type="date" required>
                    </div>

                    <div class="input-group">
                        <label>Dirección de Residencia</label>
                        <input type="text" placeholder="Calle, Carrera, Barrio" required>
                    </div>

                    <div class="input-group">
                        <label for="rol">Rol</label>
                        <select id="rol" required>
                            <option value="" disabled selected>Seleccione...</option>
                            <option value="medico">Médico</option>
                            <option value="repartidor">Repartidor</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="contraseña">Contraseña</label>
                        <input type="password" id="contraseña" placeholder="••••••••" required minlength="6">
                    </div>

                    <div class="input-group">
                        <label>Confirmar Contraseña</label>
                        <input type="password" placeholder="••••••••" required minlength="6">
                    </div>
                </div>

                <div id="mensaje"></div>

                <button type="submit" class="btn-registro">Registrarse</button>
                
                <p class="footer-text">¿Ya tienes cuenta? <a href="/vista/login.html">Inicia sesión</a></p>
            </form>
        </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/registro.js"></script>
</body>
</html>
