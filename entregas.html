<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Gestión de Medicamentos</title>
    <link rel="stylesheet" href="/public/style/entregas.css">
   
</head>
<body>

    <nav>
        <div class="logo-section">
          <form action="/login" method="POST">
        <img src="/img/icono.png" alt="SALUDCONECTA " class="imagen-centrada" width="50" height="50">
        
      </form>
            <p>Sistema Gestión de Medicamentos</p>
        </div>
      <a href="/vista/medicamentos" class="nav-item">Inventario</a>
      <a href="/vista/pacientes" class="nav-item">Pacientes y Prescripciones</a>
      <a href="/vista/entregas" class="nav-item active">Entregas</a>
      <a href="/vista/facturas" class="nav-item">Facturación</a>
      <a href="#" title="Próximamente" class="nav-item">Reportes</a>
    </nav>

    <main>
        <div class="header-main">
            <h2>Entregas</h2>
        </div>


        <div class="map-container">
            <div class="map-placeholder">
                <img src="https://via.placeholder.com/1000x400/e0e0e0/999999?text=Mapa+de+Rutas+de+Entrega" alt="Mapa">
                <i class="fas fa-map-pin pin-1"></i>
                <i class="fas fa-map-pin pin-2"></i>
            </div>
        </div>
        <div class="container-table">
            <div class="toolbar">
                <div class="search-box">
                    <input type="text" placeholder="Buscar...">
                
                </div>
            </div>

            <form id="entForm" class="toolbar">
                <input type="text" id="paciente" placeholder="Nombre del paciente" required>
                <input type="text" id="medicamento" placeholder="Medicamento" required>
                <button type="submit" class="btn btn-add">Agregar Entrega</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>ID Entrega</th>
                        <th>Paciente</th>
                        <th>Medicamento</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="entTable"></tbody>
            </table>
        </div>
    </main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/public/authFetch.js"></script>
<script src="/public/entregas.js"></script>
</body>
</html>
