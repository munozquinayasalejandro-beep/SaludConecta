<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="/public/style/login.css">

</head>

<body>

    <div class="form-container">
      <h1>
  <span class="parte-uno">SALUD</span>
  <span class="parte-dos">CONECTA</span>
  </h1> 


      <form action="/login" method="POST">
        <img src="/img/icono.png" alt="SALUDCONECTA " class="imagen-centrada" width="100" height="100">
         <h2>Inicia sesión para continuar</h2>
      </form>
    <form id="loginForm">
      <label for="tipoDocumento" class="form-label">Tipo de Documento</label>
      <select id="tipoDocumento" name="tipoDocumento" class="form-select" required>
        <option value="" disabled selected>Seleccione...</option>
        <option value="CC">Cédula de Ciudadanía</option>
        <option value="TI">Tarjeta de Identidad</option>
      </select>

      <label for="numeroDocumento" class="form-label">Número de Documento</label>
      <input type="text" id="numeroDocumento" name="numeroDocumento" class="form-control" placeholder="Ingresa tu número de documento" required>

      <label for="contraseña" class="form-label">Contraseña</label>
      <div class="input-group mb-3">
        <input type="password" id="contraseña" name="contraseña" class="form-control" placeholder="Ingresa tu contraseña" required>
        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">Ver</button>
      </div>

       <button type="submit" class="btn btn-primary w-100">
  Iniciar Sesión
</button>  

     <p class="texto-centrado" id="mensaje"></p>
     <p class="texto-centrado"><a href="#">¿Olvidaste tu contraseña?</a></p>
     <p class="texto-centrado">¿No tienes una cuenta? <a href="/vista/registro">Regístrate</a></p>
      
    </form>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/auth.js"></script>
</body>
</html>
